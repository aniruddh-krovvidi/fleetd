name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install grpcio grpcio-tools
      - run: python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. fleet.proto
      # end-to-end: real gRPC controller + simulated boards (hardware-in-the-loop style gate)
      - run: python test_fleet.py
      - run: python chaos.py --boards 16 --jobs 100 --duration 10
